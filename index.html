<!DOCTYPE html>
<html lang="sv">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ord & Omtanke – Premium Calm Studio</title>

    <!-- Kopplar till din style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bakgrundselement -->
    <div class="nebula"></div>
    <div class="stars"></div>

    <!-- Header -->

        <h1 class="title">Ord & Omtanke</h1>
        <p class="subtitle">En mjukare, varmare och mer minnesvärd upplevelse</p>
    </header>

    <!-- Main content -->
    <main class="container">

        <!-- Intro card -->
        <section class="card">
            <h2 class="section-title">Välkommen</h2>
            <p class="intro-text">
                Hej och välkommen till Ord & Omtanke — en plats där stillhet, värme och omtanke får ta plats.
            </p>
            <button id="next-card" class="button">Nästa</button>
        </section>

        <!-- Samlingskort -->
        <section class="card">
            <h2 class="section-title">Samlingskort</h2>
            <ul class="card-list">
                <li>Gotland</li>
                <li>Hospitality</li>
                <li>mm</li>

    </main>
