<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ord & Omtanke</title>

    <style>
        body {
            background: #0d0f1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }

        #card-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .input-section {
            margin-top: 20px;
        }

        .card-list {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }

        .card-list li {
            margin: 4px 0;
        }

        #user-answer {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        #send-ai {
            background-color: #4a7cff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        #ai-response {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            min-height: 60px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h2>Ord & Omtanke</h2>

    <div id="card-text"></div>

    <button id="next-card">Nästa kort</button>

    <div class="input-section">
        <p>Det här är några av våra samlingskort:</p>
        <ul class="card-list">
            <li>Gotland</li>
            <li>Hospitality</li>
            <li>mm</li>
            <li>Aa</li>
        </ul>

        <input id="user-answer" type="text" placeholder="Skriv här..." />
        <button id="send-ai">Next</button>
    </div>

    <h3>Dagens citat:</h3>
    <div id="ai-response">Inget citat ännu...</div>

    <script src="script.js"></script>

</body>
</html>
