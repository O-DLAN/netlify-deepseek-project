<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ord & Omtanke – Space Glow</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center, #0a0a1a, #000000);
            color: white;
            overflow-x: hidden;
            text-align: center;
            animation: spaceGlow 20s ease-in-out infinite;
        }

        @keyframes spaceGlow {
            0% { background: radial-gradient(circle at center, #0a0a1a, #000000); }
            50% { background: radial-gradient(circle at center, #12001f, #000000); }
            100% { background: radial-gradient(circle at center, #0a0a1a, #000000); }
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(white 1px, transparent 1px) repeat;
            background-size: 3px 3px;
            opacity: 0.18;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(120, 0, 255, 0.25), transparent 60%);
            filter: blur(80px);
            z-index: -2;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 35px rgba(0, 150, 255, 0.7);
            margin-bottom: 30px;
        }

        #card-text {
            font-size: 28px;
            text-shadow: 0 0 15px #00aaff;
            animation: textPulse 4s ease-in-out infinite;
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 10px #00aaff; }
            50% { text-shadow: 0 0 25px #33ccff; }
            100% { text-shadow: 0 0 10px #00aaff; }
        }

        .card-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .card-list li {
            margin: 6px 0;
            font-size: 18px;
            text-shadow: 0 0 10px #ff00ff;
        }

        #next-card {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #00aaff;
            color: black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #00aaff;
            transition: 0.2s;
        }

        #next-card:hover {
            background: #33ccff;
            box-shadow: 0 0 30px #33ccff;
        }
    </style>
</head>

<body>

    <div class="nebula"></div>
    <div class="stars"></div>

    <div class="container">

        <div class="card">
            <div id="card-text"></div>
            <button id="next-card">Nästa kort</button>
        </div>

        <div class="card">
            <p>Det här är några av våra samlingskort:</p>
            <ul class="card-list">
                <li>Gotland</li>
                <li>Hospitality</li>
                <li>mm</li>
                <li>Aa</li>
            </ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
