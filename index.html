<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ord & Omtanke – Space Glow</title>

    <style>
        /* SPACE GLOW – RYMD MED LUGN FÄRGSKIFTNING */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at center, #0a0a1a, #000000);
            color: white;
            overflow: hidden;
            animation: spaceGlow 20s ease-in-out infinite;
            text-align: center;
        }

        /* Mjuk färgskiftning i bakgrunden */
        @keyframes spaceGlow {
            0% { background: radial-gradient(circle at center, #0a0a1a, #000000); }
            50% { background: radial-gradient(circle at center, #12001f, #000000); }
            100% { background: radial-gradient(circle at center, #0a0a1a, #000000); }
        }

        /* STILLASTÅENDE STJÄRNOR */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(white 1px, transparent 1px) repeat;
            background-size: 3px 3px;
            opacity: 0.18;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* NEBULOSA */
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(120, 0, 255, 0.25), transparent 60%);
            filter: blur(80px);
            z-index: -2;
        }

        /* ❤️ KORTLEK-SKUGGA NERE TILL HÖGER */
        .card-deck-shadow {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            background: radial-gradient(
                circle at center,
                rgba(255, 0, 100, 0.25),
                rgba(255, 0, 100, 0.05),
                transparent 70%
            );
            border-radius: 20px;
            transform: rotate(12deg);
            filter: blur(25px);
            opacity: 0.55;
            z-index: -1;
        }

        .card-deck-shadow::before {
            content: "♥";
            position: absolute;
            font-size: 140px;
            color: rgba(255, 0, 120, 0.25);
            top: 10px;
            left: 20px;
            filter: blur(8px);
        }

        /* RUBRIK ÖVERST */
        h1 {
            margin-top: 30px;
            font-size: 32px;
            text-shadow: 0 0 20px #00aaff;
            animation: textPulse 4s ease-in-out infinite;
        }

        /* CONTAINER */
        .container {
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        /* KORTET */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 35px rgba(0, 150, 255, 0.7);
            margin-bottom: 30px;
        }

        /* TEXT MED PULSERANDE GLOW */
        #card-text {
            font-size: 28px;
            text-shadow: 0 0 15px #00aaff;
            animation: textPulse 4s ease-in-out infinite;
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 10px #00aaff; }
            50% { text-shadow: 0 0 25px #33ccff; }
            100% { text-shadow: 0 0 10px #00aaff; }
        }

        /* SAMLINGSKORT-LISTA */
        .card-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .card-list li {
            margin: 6px 0;
            font-size: 18px;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* KNAPP */
        #next-card {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #00aaff;
            color: black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #00aaff;
            transition: 0.2s;
        }

        #next-card:hover {
            background: #33ccff;
            box-shadow: 0 0 30px #33ccff;
        }
    </style>
</head>

<body>

    <div class="nebula"></div>
    <div class="stars"></div>
    <div class="card-deck-shadow"></div>

    <!-- ⭐ Rubrik som alltid syns -->
    <h1>Välkommen till Ord & Omtanke</h1>

    <div class="container">

        <div class="card">
            <div id="card-text">Hej och välkommen till Ord & Omtanke!</div>
            <button id="next-card">Nästa</button>
        </div>

        <div class="card">
            <p>Det här är några av våra samlingskort:</p>
            <ul class="card-list">
                <li>Gotland</li>
                <li>Hospitality</li>
                <li>mm</li>
                <li>Aa</li>
            </ul>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
